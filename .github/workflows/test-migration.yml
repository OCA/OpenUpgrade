# This workflow will install Python dependencies, run tests and lint with a
# single version of Python. For more information see:
# https://help.github.com/actions/language-and-framework-guides\
# /using-python-with-github-actions

name: Test OpenUpgrade migration

on:
  pull_request:
    branches:
      - "20.0*"
  push:
    branches:
      - "20.0"
      - "20.0-ocabot-*"
# TODO remove
      - "20.0-mail"

jobs:
  test:
    runs-on: ubuntu-22.04
    env:
      DB: "openupgrade"
      DOWNLOADS: https://github.com/${{github.repository}}/releases/download/databases
      PGHOST: "localhost"
      PGPASSWORD: "odoo"
      PGUSER: "odoo"
      OCA_IMAGE_PREV: ghcr.io/oca/oca-ci/py3.10-ocb19.0:latest
      OCA_IMAGE_CURRENT: ghcr.io/oca/oca-ci/py3.12-ocb20.0:latest
    services:
      postgres:
        image: postgres:16.0
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: openupgrade
        ports:
          - 5432:5432
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Wait for postgres
        run: while ! pg_isready; do sleep 1; done
      - name: Restore database
        run: |
          wget -q -O- $DOWNLOADS/19.0.psql | pg_restore -d $DB --no-owner
          psql $DB -c "UPDATE ir_module_module SET demo=False"
      - name: Check out OpenUpgrade
        uses: actions/checkout@v4
        with:
          path: openupgrade
      - name: Download docker images and start containers
        run: |
          docker pull $OCA_IMAGE_PREV
          docker pull $OCA_IMAGE_CURRENT
          docker run -e PGHOST=$PGHOST --net=host $OCA_IMAGE_PREV psql -l
          docker run -d --net=host --name openupgrade_prev $OCA_IMAGE_PREV sleep infinity
          docker run -d --net=host --name openupgrade_current --volume=$(pwd)/openupgrade:/opt/openupgrade $OCA_IMAGE_CURRENT sleep infinity
      - name: Install dependencies
        run: |
          # install dependencies not available in the oca image
          # cloud_storage_google, needs pin to not pull incompatible cryptography version
          docker exec openupgrade_prev pip install "google-auth<2.48.0"
          # install openupgrade dependencies
          docker exec openupgrade_current sh -c "
            cd /opt/openupgrade
            oca_install_addons
          "
      - name: Test data
        run: |
          if test -n "$(ls openupgrade/openupgrade_scripts/scripts/*/tests/data*.py 2> /dev/null)"; then
             for snippet in openupgrade/openupgrade_scripts/scripts/*/tests/data*.py; do
               docker exec -e PGHOST=$PGHOST openupgrade_prev odoo shell -d $DB < $snippet
             done
          fi
      - name: OpenUpgrade test
        id: run_migration
        run: |
          # select modules and perform the upgrade
          MODULES_OLD=$(\
              sed -n '/^+========/,$p' \
              openupgrade/docsource/modules190-200.rst \
              | grep "Done\|Partial\|Nothing" \
              | grep -v "theme_" \
              | sed -rn 's/((^\| *\|del\| *)|^\| *)([0-9a-z_]*)[ \|].*/\3/g p' \
              | sed '/^\s*$/d' \
              | paste -d, -s)
          MODULES_NEW=$(\
              sed -n '/^+========/,$p' \
              openupgrade/docsource/modules190-200.rst \
              | grep "Done\|Partial\|Nothing" \
              | grep -v "theme_" \
              | sed -rn 's/((^\| *\|new\| *)|^\| *)([0-9a-z_]*)[ \|].*/\3/g p' \
              | sed '/^\s*$/d' \
              | paste -d, -s)
          echo "modules_old=$MODULES_OLD" >> $GITHUB_OUTPUT
          echo "modules_new=$MODULES_NEW" >> $GITHUB_OUTPUT
          if [ -z "$MODULES_NEW" ]; then
             echo "No modules to test yet"
             exit
          fi
          REQUEST="update ir_module_module set state='uninstalled' \
              where name not in ('$(echo $MODULES_OLD | sed -e "s/,/','/g")')"
          echo Set the modules as not installable if they are not in the following list : $MODULES_OLD
          echo Running $REQUEST
          psql $DB -c "$REQUEST"
          ADDONS_PATHS="\
              $GITHUB_WORKSPACE/odoo/addons \
              $GITHUB_WORKSPACE/odoo/odoo/addons \
              $GITHUB_WORKSPACE/openupgrade"
          echo Execution of Openupgrade with the update of the following modules : $MODULES_NEW
          # Silence redundant logs from unlinking records (1 line is enough)
          # to prevent log overflow
          docker exec -e PGHOST=$PGHOST -e OPENUPGRADE_USE_DEMO=yes openupgrade_current sh -c "
            cd /opt/openupgrade
            coverage run \\
                --source=/opt/openupgrade/openupgrade_scripts/scripts \\
            \$(which odoo) \\
                --load=base,web,openupgrade_framework \\
                --database=$DB \\
                --test-enable \\
                --test-tags openupgrade \\
                --log-handler odoo.models.unlink:WARNING \\
                --stop-after-init \\
                --without-demo=$MODULES_NEW \\
                --update=$MODULES_NEW
          "
      - name: Generate coverage.xml
        if: ${{ steps.run_migration.outputs.modules_new != '' }}
        run: |
          docker exec openupgrade_current sh -c "
            cd /opt/openupgrade
            coverage xml
          "
          docker cp openupgrade_current:/opt/openupgrade/coverage.xml .
      - uses: codecov/codecov-action@v4
        if: ${{ steps.run_migration.outputs.modules_new != '' }}
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
